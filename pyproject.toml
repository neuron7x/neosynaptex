[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "neosynaptex"
version = "3.0.0"
description = "NFI — Neuromodulatory Field Intelligence. γ ≈ 1.0 across independent substrates. Intelligence as regime property."
readme = "README.md"
authors = [{ name = "Yaroslav Vasylenko", email = "neuron7x@proton.me" }]
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
keywords = [
    "neuroscience",
    "criticality",
    "coherence",
    "scaling-laws",
    "topology-laws",
    "metastability",
    "gamma-scaling",
    "cognitive-field-protocol",
    "human-ai-co-adaptation",
    "agent-based-model",
    "phase-transition",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "PyWavelets>=1.8",
    "PyYAML>=6.0",
    "networkx>=3.2.1",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "hypothesis>=6.0",
    "pytest-cov>=7.1.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "mypy>=1.20.1",
    "ruff>=0.15.10",
    "import-linter>=2.11",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "PyWavelets>=1.8",
    "wfdb>=4.2",
    "scikit-learn>=1.5",
    "hypothesis>=6.0",
    "jsonschema>=4.0",
]
security = [
    "pip-audit>=2.10.0",
    "bandit>=1.9.4",
]

[project.urls]
Repository = "https://github.com/neuron7xLab/neosynaptex"
Issues = "https://github.com/neuron7xLab/neosynaptex/issues"

[tool.setuptools]
py-modules = ["neosynaptex"]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "core*",
    "contracts*",
    "substrates*",
    "agents*",
    "evl*",
    "cognitive_immune_os*",
    "evidence",
    "evidence_bundle_v1",
]

[tool.setuptools.package-data]
evidence = ["*.json", "*.jsonl", "*.txt"]
evidence_bundle_v1 = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (>30 s); run explicitly or in full CI only",
    "trace_eq(eq_id): binds a test to a formal equation identifier",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = false
disable_error_code = ["redundant-cast"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "core/eai/dopa_closure_v2.py",
    "core/eai/dopa_controls.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "FIX", "ERA", "RET"]
ignore = [
    "N803",
    "N806",
    "N814",
    "N818",
    "E402",
    "E741",
    "B905",
    "B007",
]

[tool.ruff.lint.isort]
known-third-party = ["pywt"]

[tool.ruff.lint.per-file-ignores]
"core/eai/gamma_bridge.py" = ["ERA001"]
